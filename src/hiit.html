<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>HIIT 20 分鐘運動計時器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#eaf0ff;background:#0f1725}*{box-sizing:border-box}body{margin:0;padding:20px 14px 40px}.wrap{max-width:600px;margin:auto}h1{font-size:23px;margin:7px 0 6px}.subtitle,.note{color:#a5b4ca;font-size:13px;line-height:1.6}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:8px;background:#2c384b;border-radius:12px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#5ca9ff;width:0;transition:width .25s}.stage{background:#192537;border:1px solid #34455b;border-radius:24px;text-align:center;padding:30px 15px;margin-bottom:16px}.phase{font-size:23px;font-weight:750;color:#8ad4ac}.name{font-size:32px;font-weight:800;margin-top:12px}.clock{font-size:clamp(84px,22vw,125px);line-height:1.35;font-weight:800;font-variant-numeric:tabular-nums}.hint{color:#b9c8db}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:14px;font-weight:650}select{width:100%;margin-top:7px;background:#192537;color:white;border:1px solid #50627a;border-radius:12px;font-size:17px;padding:13px 8px}.controls{display:flex;gap:8px;margin-top:15px}button{border-radius:12px;background:#24344a;color:#fff;border:1px solid #455a73;min-height:48px;padding:10px 12px;cursor:pointer;font-weight:700;font-size:15px}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#397ee6;border:0;flex:1;font-size:18px}.full{width:100%;margin-top:12px}.panel{background:#192537;border:1px solid #34455b;border-radius:15px;padding:16px;margin-top:16px}.toggle{display:flex;align-items:center;gap:9px}input[type=checkbox]{width:20px;height:20px;accent-color:#5ca9ff}input[type=range]{flex:1;min-width:0;accent-color:#5ca9ff}.volume{display:flex;align-items:center;gap:12px;margin:15px 0}.volume output{min-width:40px;text-align:right}.exercises{display:grid;gap:9px}.exercise{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#182335}.exercise.active{border-color:#5ca9ff;background:#233958}.exercise span{flex:1}.exercise small{color:#a5b4ca}.badge{background:#334760;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}.section-title{margin:18px 0 10px;font-size:16px}.note{margin-top:14px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
</style></head><body><main class="wrap"><h1>🏋️ 20 分鐘 HIIT 計時器</h1><p class="subtitle">5 種動作 × 4 輪 · 運動 30 秒／休息 30 秒</p><div class="row"><strong id="progressText">第 1 / 5 組 · 第 1 / 4 輪</strong><span id="total">剩餘 20:00</span></div><div class="progress"><div id="bar"></div></div><section class="stage"><div class="phase" id="phase">準備開始</div><div class="name" id="name">蛙跳</div><div class="clock" id="clock" role="timer">30</div><div class="hint" id="hint">運動 30 秒 · 休息 30 秒</div></section><div class="grid"><label>切換運動<select id="exercise"><option value="0">1. 蛙跳</option><option value="1">2. 分腿跳</option><option value="2">3. 波比跳</option><option value="3">4. 伏地挺身</option><option value="4">5. 深蹲</option></select></label><label>切換第幾輪<select id="round"><option value="0">第 1 輪</option><option value="1">第 2 輪</option><option value="2">第 3 輪</option><option value="3">第 4 輪</option></select></label></div><div class="controls"><button id="prev">◀ 上一輪</button><button id="start" class="primary">▶ 開始</button><button id="next">下一輪 ▶</button></div><section class="panel"><div class="row"><div><strong>♫ 運動背景音樂</strong><p class="subtitle" style="margin:4px 0">內建電子節奏 · 128 BPM</p></div><label class="toggle"><input id="music" type="checkbox" checked>開啟</label></div><div class="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="35" aria-label="音樂音量"><output id="volumeLabel">35%</output></div><label class="toggle"><input id="voice" type="checkbox" checked>中文語音與倒數提示</label></section><section class="panel"><div class="row"><div><strong>☀️ 螢幕常亮</strong><p class="subtitle" id="wakeStatus" role="status" aria-live="polite" style="margin:4px 0">開始運動時嘗試保持螢幕開啟</p></div><label class="toggle"><input id="wakeEnabled" type="checkbox" checked>開啟</label></div></section><button class="full" id="reset">↺ 從頭開始</button><h2 class="section-title">點擊動作直接切換</h2><div class="exercises" id="list"></div><p class="note">每個動作有 4 輪；深蹲的休息 30 秒改為維持深蹲姿勢。切換動作或輪次會從該輪的運動階段開始。手機鎖定或切至背景時，系統可能限制音樂與語音播放；螢幕常亮需要支援的瀏覽器及 HTTPS 網址，功能無法使用時不影響計時器。</p></main><script>
(()=>{const $=id=>document.getElementById(id),names=['蛙跳','分腿跳','波比跳','伏地挺身','深蹲'];let elapsed=0,running=false,finished=false,startedAt=0,timer=null,lastPhase=-1,lastSecond=-1,ctx=null,musicTimer=null,beat=0,gain=null;let wakeSentinel=null,wakeToken=0;
function setWakeStatus(s){const e=$('wakeStatus');if(e)e.textContent=s}
async function requestWake(){
  const token=++wakeToken;
  if(!running||!$('wakeEnabled').checked)return;
  if(!window.isSecureContext||!navigator.wakeLock||typeof navigator.wakeLock.request!=='function'){
    setWakeStatus('目前開啟方式不支援；計時器仍可正常使用');return;
  }
  if(document.visibilityState==='hidden'){setWakeStatus('返回網頁後重新啟用');return}
  if(wakeSentinel){setWakeStatus('運動中保持螢幕開啟 ✓');return}
  try{
    const s=await navigator.wakeLock.request('screen');
    if(token!==wakeToken||!running||!$('wakeEnabled').checked){await s.release();return}
    wakeSentinel=s;
    s.addEventListener('release',()=>{if(wakeSentinel===s){wakeSentinel=null;setWakeStatus('螢幕常亮已中斷，返回頁面後重試')}});
    setWakeStatus('運動中保持螢幕開啟 ✓');
  }catch(e){setWakeStatus('系統未允許螢幕常亮；計時器可正常使用')}
}
function stopWake(){++wakeToken;const s=wakeSentinel;wakeSentinel=null;if(s){try{Promise.resolve(s.release()).catch(()=>{})}catch(e){}}setWakeStatus('未啟用（運動開始後自動嘗試）')}
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');function initAudio(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!gain){gain=ctx.createGain();gain.connect(ctx.destination)}gain.gain.value=Number($('volume').value)/100*.45}catch(e){}}function tone(freq,duration=.09,type='sine',vol=.2,time){if(!ctx)return;try{const t=time??ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.connect(g);g.connect(gain||ctx.destination);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.start(t);o.stop(t+duration+.01)}catch(e){}}function drum(kind,t){if(kind==='kick'){tone(130,.15,'sine',.5,t);tone(57,.22,'sine',.5,t)}else if(kind==='snare'){tone(170,.08,'triangle',.25,t);tone(980,.06,'sawtooth',.07,t)}else tone(2900,.025,'square',.045,t)}function playBeat(){if(!running||!$('music').checked||!ctx)return;const t=ctx.currentTime+.012;drum('hat',t);if(beat%2===0)drum('kick',t);if(beat%4===2)drum('snare',t);if(beat%8===0)tone([110,98,130.81,87.31][Math.floor(beat/8)%4],.26,'sawtooth',.16,t);beat++}function musicStart(){musicStop();if(!running||!$('music').checked)return;initAudio();playBeat();musicTimer=setInterval(playBeat,60000/128/2)}function musicStop(){clearInterval(musicTimer);musicTimer=null}function speak(s){if(!$('voice').checked)return;try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='zh-TW';u.rate=1.12;speechSynthesis.speak(u)}}catch(e){}}function stopVoice(){try{speechSynthesis.cancel()}catch(e){}}function render(){const p=Math.min(39,Math.floor(elapsed/30)),g=Math.floor(p/8),r=Math.floor(p%8/2),work=p%2===0,rem=30-elapsed%30;$('progressText').textContent=finished?'訓練完成':`第 ${g+1} / 5 組 · 第 ${r+1} / 4 輪`;$('total').textContent='剩餘 '+fmt(1200-elapsed);$('bar').style.width=elapsed/12+'%';$('name').textContent=finished?'全部完成！':names[g];$('clock').textContent=finished?'00':String(rem).padStart(2,'0');$('phase').textContent=finished?'🎉 訓練完成':!running&&elapsed===0?'準備開始':work?'🔥 運動中':g===4?'🧎 深蹲停留':'🌿 休息中';$('hint').textContent=finished?'完成 20 分鐘訓練':!running&&elapsed===0?'運動 30 秒 · 休息 30 秒':!running?'已暫停':work?'維持節奏，注意姿勢':g===4?'深蹲停留 30 秒':'放鬆，準備下一輪';$('exercise').value=String(g);$('round').value=String(r);$('start').textContent=running?'⏸ 暫停':finished?'▶ 再做一次':elapsed>0?'▶ 繼續':'▶ 開始';$('prev').disabled=elapsed<60&&!finished;$('next').disabled=finished||Math.floor(elapsed/60)>=19;document.querySelectorAll('[data-group]').forEach((n,i)=>{n.classList.toggle('active',i===g&&!finished);n.querySelector('b').textContent=i<g||finished?'✓':i+1});if(running&&p!==lastPhase){lastPhase=p;tone(work?880:550,.16,'sine',.6);speak(work?`第${r+1}輪，${names[g]}，開始`:g===4?'深蹲停留三十秒':'休息三十秒')}if(running&&rem<=3&&rem!==lastSecond){lastSecond=rem;tone(750,.1,'sine',.5);if(rem===3)speak('三、二、一')}if(rem>3)lastSecond=-1}function tick(){if(!running)return;elapsed=Math.min(1200,Math.floor((Date.now()-startedAt)/1000));if(elapsed>=1200){running=false;finished=true;clearInterval(timer);timer=null;musicStop();stopWake();tone(1100,.5,'sine',.6);speak('訓練完成，辛苦了')}render()}function jump(g,r){g=Math.max(0,Math.min(4,g));r=Math.max(0,Math.min(3,r));elapsed=g*240+r*60;finished=false;lastPhase=-1;lastSecond=-1;stopVoice();if(running){startedAt=Date.now()-elapsed*1000;tick()}else render()}$('exercise').addEventListener('change',e=>jump(Number(e.target.value),Number($('round').value)));$('round').addEventListener('change',e=>jump(Number($('exercise').value),Number(e.target.value)));$('prev').addEventListener('click',()=>{const i=Math.floor(elapsed/60);if(i>0)jump(Math.floor((i-1)/4),(i-1)%4)});$('next').addEventListener('click',()=>{const i=Math.floor(elapsed/60);if(i<19)jump(Math.floor((i+1)/4),(i+1)%4)});$('start').addEventListener('click',()=>{if(running){running=false;clearInterval(timer);timer=null;musicStop();stopVoice();stopWake();render();return}if(finished){elapsed=0;finished=false}initAudio();running=true;startedAt=Date.now()-elapsed*1000;lastPhase=-1;tick();timer=setInterval(tick,200);musicStart();requestWake()});$('reset').addEventListener('click',()=>{running=false;finished=false;elapsed=0;lastPhase=-1;lastSecond=-1;clearInterval(timer);timer=null;musicStop();stopVoice();stopWake();render()});$('music').addEventListener('change',()=>{$('music').checked?musicStart():musicStop()});$('wakeEnabled').addEventListener('change',()=>{if($('wakeEnabled').checked){if(running)requestWake();else setWakeStatus('開始運動時嘗試保持螢幕開啟')}else stopWake()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running&&$('wakeEnabled').checked)requestWake()});$('volume').addEventListener('input',e=>{$('volumeLabel').textContent=e.target.value+'%';if(gain)gain.gain.value=Number(e.target.value)/100*.45});$('list').innerHTML=names.map((n,i)=>`<button type="button" data-group="${i}" class="exercise"><b class="badge">${i+1}</b><span>${n}</span><small>${i===4?'休息時維持深蹲':'4 分鐘'}</small></button>`).join('');document.querySelectorAll('[data-group]').forEach(n=>n.addEventListener('click',()=>jump(Number(n.dataset.group),0)));render()})();
</script></body></html>
